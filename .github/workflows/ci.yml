---
name: CI
"on":
  pull_request: {branches: [main]}
  push: {branches: [main]}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Install GDScript Toolkit
        uses: Scony/godot-gdscript-toolkit@4.5.0
      - name: Run Format Checks
        run: gdformat --line-length=120 --check addons/godot_option_result/
      - name: Run Lint Checks
        run: gdlint addons/godot_option_result/
      - name: Run Unit Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.6.2"
          paths: res://test
