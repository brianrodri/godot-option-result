---
name: CI
"on":
  pull_request: {branches: [main]}
  push: {branches: [main]}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Install GDScript Formatter
        run: |
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/bin"
            curl -fsSL -o /tmp/gdfmt.zip \
                "https://github.com/GDQuest/GDScript-formatter/releases/download/${GDFMT_VERSION}/gdscript-formatter-${GDFMT_VERSION}-linux-x86_64.zip"
            unzip -p /tmp/gdfmt.zip "gdscript-formatter-${GDFMT_VERSION}-linux-x86_64" > "$RUNNER_TEMP/bin/gdscript-formatter"
            chmod +x "$RUNNER_TEMP/bin/gdscript-formatter"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        env:
            GDFMT_VERSION: "0.19.0"
      - name: Run Format Checks
        run: gdscript-formatter --check --reorder-code $(git ls-files | grep '\.gd$' | grep -v '^addons/')
      - name: Install GDScript Toolkit
        uses: Scony/godot-gdscript-toolkit@4.5.0
      - name: Run Lint Checks
        run: gdlint src/ test/
      - name: Run Unit Tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: "4.6.1"
          paths: res://test
